appId: io.github.tenmaryut.suarastudio
productName: Suara Studio
copyright: Copyright © 2026 tenmaryut
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
extraResources:
  - from: build/icon.png
    to: icon.png
asar: true
publish: null

mac:
  category: public.app-category.music
  icon: build/icon.png
  # Ad-hoc signature until a Developer ID certificate is configured.
  identity: '-'
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Suara Studio needs access to your microphone to record audio.
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  target:
    - target: zip
      arch: [arm64, x64]
    - target: dmg
      arch: [arm64, x64]

win:
  icon: build/icon.png
  artifactName: ${name}-${version}-win-${arch}-setup.${ext}
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Suara Studio
  deleteAppDataOnUninstall: false

linux:
  icon: build/icon.png
  executableName: suara-studio
  syncDesktopName: true
  category: AudioVideo
  synopsis: Record and edit audio
  description: Suara Studio records and edits audio in one desktop app.
  maintainer: tenmaryut <tenmaryut@users.noreply.github.com>
  vendor: tenmaryut
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: tar.gz
      arch: [x64]

deb:
  artifactName: ${name}_${version}_${arch}.${ext}

rpm:
  artifactName: ${name}-${version}.${arch}.${ext}
